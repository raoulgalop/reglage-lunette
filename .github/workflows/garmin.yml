name: Appli Garmin (Connect IQ)

on:
  push:
    paths:
      - 'garmin/source/**'
      - 'garmin/resources/**'
      - 'garmin/manifest.xml'
      - 'garmin/monkey.jungle'
      - '.github/workflows/garmin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/matco/connectiq-tester:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler pour Epix 2 / Epix Pro
        shell: bash
        run: |
          MC=$(command -v monkeyc || find / -name monkeyc -type f 2>/dev/null | head -1)
          echo "monkeyc : $MC"
          "$MC" --version || true
          DEV=$(find / -type d -name Devices -path '*ConnectIQ*' 2>/dev/null | head -1)
          echo "appareils : $DEV"; ls "$DEV" | grep -i -E 'epix|fenix7' | tr '\n' ' '; echo
          openssl genrsa -out /tmp/k.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/k.pem -out /tmp/k.der -nocrypt
          mkdir -p out
          ok=0
          for d in epix2 epix2pro42mm epix2pro47mm epix2pro51mm; do
            echo "=== $d"
            if "$MC" -d $d -f garmin/monkey.jungle -o out/ReglageLunette-$d.prg -y /tmp/k.der -l 0 -r -w 2>&1 | tee -a out/build.log; then
              [ -f out/ReglageLunette-$d.prg ] && ok=1
            fi
          done
          ls -la out
          [ $ok = 1 ]
      - name: Essai dans le simulateur (captures d'écran)
        continue-on-error: true
        shell: bash
        run: |
          command -v Xvfb >/dev/null && command -v xdotool >/dev/null && command -v convert >/dev/null || \
            (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xdotool imagemagick x11-apps >/dev/null)
          export DISPLAY=:99
          echo "HOME=$HOME"; export HOME=/root
          ls /root/.Garmin/ConnectIQ/Devices/epix2
          pgrep Xvfb >/dev/null || (Xvfb :99 -screen 0 1280x1024x24 & sleep 3)
          SIM=$(find /connectiq/bin -name simulator -type f | head -1)
          "$SIM" > /tmp/sim.log 2>&1 &
          sleep 12
          MD=/connectiq/bin/monkeydo
          timeout 60 "$MD" out/ReglageLunette-epix2.prg epix2 > out/monkeydo.log 2>&1 &
          sleep 25
          mkdir -p out/shots
          shot() { import -window root "out/shots/$1.png" || xwd -root -silent | convert xwd:- "out/shots/$1.png"; }
          shot 1-principal
          W=$(xdotool search --name "Simulator" | head -1); echo "fenêtre : $W"
          [ -n "$W" ] && xdotool windowactivate --sync $W || true
          xdotool key Up; sleep 1; xdotool key Up; sleep 2; shot 2-distance-plus
          xdotool key Return; sleep 3; shot 3-table
          xdotool key Escape; sleep 2; shot 4-retour
          # 2e essai : version de test qui ouvre le menu au démarrage
          rm -rf /tmp/gt && cp -r garmin /tmp/gt && rm -rf /tmp/gt/bin
          sed -i 's/    function onShow() {/    function onShow() {\n        if (!TESTED) { TESTED = true; openMenu(); }/' /tmp/gt/source/MainView.mc
          echo 'var TESTED = false;' >> /tmp/gt/source/MainView.mc
          /connectiq/bin/monkeyc -d epix2 -f /tmp/gt/monkey.jungle -o /tmp/test.prg -y /tmp/k.der -l 0 -w
          timeout 120 "$MD" /tmp/test.prg epix2 > out/monkeydo-test.log 2>&1 &
          sleep 20
          k() { for x in "$@"; do xdotool key $x; sleep 1; done; }
          shot m1-menu
          k Return; sleep 2; shot m2-munitions
          k Down Down Return; sleep 2; shot m3-menu-apres-choix
          k Down Return; sleep 2; k Up Up; shot m4-editeur-v0
          k Return Down Down Down Down Down Down Down Return; sleep 2; k Up Up Up Up Up Up Up Up Up Up; shot m5-editeur-vent
          k Return Escape; sleep 2; shot m6-principal-vent
          k Return; sleep 2; shot m7-table-vent
          cat out/monkeydo.log out/monkeydo-test.log /tmp/sim.log | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prg
          path: |
            out/*.prg
            out/*.log
            out/shots/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git rm -r -q --ignore-unmatch garmin/bin && rm -rf garmin/bin
      - uses: actions/download-artifact@v4
        with:
          name: prg
          path: garmin/bin
      - name: Enregistrer les .prg dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A garmin/bin
          git commit -m "Appli Garmin : fichiers .prg compilés [skip ci]" || exit 0
          git push
